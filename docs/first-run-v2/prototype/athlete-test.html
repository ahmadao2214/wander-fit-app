<meta charset="utf-8">
<style>body{background:#0B1220;margin:0;padding:16px;display:grid;grid-template-columns:repeat(5,120px);gap:10px}div{width:120px;height:144px;background:#131C2E;border-radius:12px}div.lit{background:#A855F7}</style>
<script src="athlete.js"></script>
<script>
addEventListener("DOMContentLoaded", () => { for (const cat of [1, 2, 3, 4]) for (const k of [0, 0.3, 0.5, 0.7, 1]) {
  const d = document.createElement('div'); if (k === 1) d.className = 'lit'; document.body.appendChild(d)
  ATHLETE.mount(d, cat, false, { litTile: '#A855F7' }).at(k, k === 1)
} })
</script>
