appId: com.offseason.asrafit
---
# A signed-out launch opens the First Run, and a relaunch comes back to it.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Let's build your plan for this season."
    timeout: 90000
- assertVisible:
    id: first-run-start
- assertVisible:
    id: first-run-sign-in
- takeScreenshot: native-launch-first-run
- tapOn:
    id: first-run-sign-in
- extendedWaitUntil:
    visible: "WELCOME BACK"
    timeout: 30000
- assertVisible:
    id: sign-in-email
- assertVisible:
    id: sign-in-password
- assertVisible:
    id: sign-in-submit
- takeScreenshot: native-launch-sign-in
- stopApp
- launchApp
# A cold start on an Android emulator takes ~36 s, same budget as the first launch.
- extendedWaitUntil:
    visible: "Let's build your plan for this season."
    timeout: 90000
# The text reaches the view tree before the first frame paints; on a slow
# Android emulator the screenshot otherwise caught a blank window.
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: native-relaunch-first-run
