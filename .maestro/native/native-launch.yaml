appId: com.offseason.asrafit
---
# A signed-out launch opens the First Run, and a relaunch comes back to it.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Let's build your plan for this season."
    timeout: 90000
- assertVisible:
    id: first-run-start
- assertVisible:
    id: first-run-sign-in
- takeScreenshot: native-launch-first-run
- tapOn:
    id: first-run-sign-in
- extendedWaitUntil:
    visible: "WELCOME BACK"
    timeout: 30000
- assertVisible:
    id: sign-in-email
- assertVisible:
    id: sign-in-password
- assertVisible:
    id: sign-in-submit
- takeScreenshot: native-launch-sign-in
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Let's build your plan for this season."
    timeout: 30000
- takeScreenshot: native-relaunch-first-run
