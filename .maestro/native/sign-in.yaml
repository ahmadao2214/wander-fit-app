# Native sign-in journey (#83): an onboarded persona signs in, reaches Today
# with its workout card, opens Profile, signs out, and lands on the First Run.
# Same steps as .maestro/journeys/sign-in.yaml, which signs out through a web
# URL; native scrolls the Profile list to the button instead, and hides the
# keyboard before Sign In.
# The runner passes PERSONA_EMAIL and PERSONA_PASSWORD with -e. The shared
# subflows are headed `url: ${VERIFY_URL}`; the runner passes VERIFY_URL=native
# so that header resolves, and this entry's appId picks the device driver.
appId: com.offseason.asrafit
---
- launchApp:
    clearState: true
- runFlow: subflows/_dismiss-anr.yaml
- runFlow: ../subflows/_evidence-start.yaml
- runFlow: ../subflows/_open-sign-in.yaml
- takeScreenshot: 01-sign-in
# Same steps as ../subflows/_sign-in.yaml, plus hideKeyboard: on Android the
# keyboard covers Sign In, and Maestro can't find a covered button. The shared
# subflow stays as is for web, which has no on-screen keyboard.
- tapOn:
    id: sign-in-email
- inputText: ${PERSONA_EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${PERSONA_PASSWORD}
- takeScreenshot: 02-filled
- hideKeyboard
- tapOn:
    id: sign-in-submit
- extendedWaitUntil:
    visible:
      id: today-heading
    timeout: 90000
# The card is missing while Today still says "Complete your setup".
- extendedWaitUntil:
    visible:
      id: today-workout-card
    timeout: 90000
- assertVisible: "Start Workout"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 03-today
- tapOn: "Profile"
- extendedWaitUntil:
    visible: "Training info"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: sign-out
    direction: DOWN
    timeout: 30000
- takeScreenshot: 04-profile
- tapOn:
    id: sign-out
# Signed out means the First Run, with "I have an account" one tap away.
- extendedWaitUntil:
    visible: "Let's build your plan for this season."
    timeout: 90000
- assertVisible:
    id: first-run-sign-in
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 05-signed-out
- runFlow: ../subflows/_evidence-stop.yaml
