# Perf setup, run once before the journeys: a clean install signs in as the
# persona in PERSONA_EMAIL / PERSONA_PASSWORD and lands on Today.
appId: com.offseason.asrafit
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "(?i)(let's build your plan for this season\\.|pick your sport)"
    timeout: 90000
# A First Run draft can reopen on a question; step back to the welcome screen.
- runFlow:
    when:
      visible: "(?i)pick your sport"
    commands:
      - tapOn: "Back"
- tapOn:
    id: first-run-sign-in
- extendedWaitUntil:
    visible: "WELCOME BACK"
    timeout: 30000
- tapOn:
    id: sign-in-email
- inputText: ${PERSONA_EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${PERSONA_PASSWORD}
- tapOn:
    id: sign-in-submit
- extendedWaitUntil:
    visible:
      id: today-heading
    timeout: 60000
