url: ${VERIFY_URL}
---
# The end-of-block check-in tells the truth (design audit F04, F11).
# Persona state phase-end: a GPP (Build) block ran its full length with no sessions
# logged, and the check-in is pending. The recap must not congratulate, and
# the athlete chooses Repeat or Move on; nothing advances on a timer.
- runFlow: ../subflows/_evidence-start.yaml
- runFlow: ../subflows/_open-sign-in.yaml
- runFlow: ../subflows/_sign-in.yaml
- extendedWaitUntil:
    visible: "Your Build block is over"
    timeout: 90000
- takeScreenshot: 01-today-check-in
- tapOn: "Check in"

# Recap: zero sessions, stated plainly, no celebration
- extendedWaitUntil:
    visible:
      id: block-recap-none
    timeout: 30000
- assertVisible: "0 of .* sessions"
- assertVisible: "No sessions were logged in this block."
- assertNotVisible: "You finished Build"
- assertNotVisible: "(?i).*completed.*"
- takeScreenshot: 02-recap
- tapOn: "Start check-in"

# Check-in, then skip the maxes
- extendedWaitUntil:
    visible: "How did Build go[?]"
    timeout: 30000
# Web reports the accessibility label as the id
- tapOn:
    id: "Just right"
# Continue sits below the 625px web viewport, inside the ScrollView
# (.maestro/flow-layout.md): a touch swipe brings it up
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 800
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Update your maxes"
    timeout: 30000
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 800
- tapOn: "Skip"

# Decision: nothing is chosen for the athlete
- extendedWaitUntil:
    visible: "What's next"
    timeout: 30000
- assertVisible: "Move on to Train"
- assertVisible: "Repeat Build"
- takeScreenshot: 03-decision
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 800
- assertVisible: "Choose an option"
- tapOn:
    id: "Repeat Build"
- tapOn: "Start Build again"

# Today: Build again from week 1, and the check-in is gone
- extendedWaitUntil:
    visible:
      id: today-workout-card
    timeout: 30000
- assertNotVisible: "Your Build block is over"
- assertVisible: "Build W1 D1.*"
- takeScreenshot: 04-today-repeated
- runFlow: ../subflows/_evidence-stop.yaml
