url: ${VERIFY_URL}
---
# In-app feedback journey:
# Signs in as an onboarded athlete, opens Profile -> Feedback & support,
# submits a private star rating, a bug report, and a feature request,
# and confirms no in-app "My feedback" history list is shown.
- runFlow: ../subflows/_evidence-start.yaml
- runFlow: ../subflows/_open-sign-in.yaml
- runFlow: ../subflows/_sign-in.yaml
- extendedWaitUntil:
    visible:
      id: today-workout-card
    timeout: 90000
- tapOn: "Profile"
- extendedWaitUntil:
    visible: "Training info"
    timeout: 30000
# Feedback & support sits just above Settings and Sign Out, below the 625px
# viewport. Profile scrolls inside the page (a single swipe falls short on web),
# so follow the #sign-out link the app-settings journey uses.
- evalScript: ${var base = VERIFY_URL; if (base.endsWith('/')) base = base.slice(0, -1); if (base.endsWith('/sign-in')) base = base.slice(0, -8); output.signOutUrl = base + '/profile#sign-out'}
- openLink: ${output.signOutUrl}
- extendedWaitUntil:
    visible:
      id: feedback-row-rate
    timeout: 30000
- assertVisible: "Feedback & support"
- assertNotVisible: "(?i)my feedback|my submissions"
- takeScreenshot: 01-profile-feedback

# 1. Private star rating
- tapOn:
    id: feedback-row-rate
# Web reports aria-label ("5 stars") as id; native reports testID ("rating-star-5").
- extendedWaitUntil:
    visible:
      id: "rating-star-5|5 stars"
    timeout: 15000
- tapOn:
    id: "rating-star-5|5 stars"
- tapOn:
    id: rating-note-input
- inputText: "Great training plan"
# The sheet scrolls inside itself; its submit button starts below the 625px
# web viewport, which the driver omits. Drag the sheet's content up to it.
- repeat:
    while:
      notVisible:
        id: rating-submit-button
    times: 4
    commands:
      - swipe:
          start: "50%, 85%"
          end: "50%, 45%"
          duration: 400
- tapOn:
    id: rating-submit-button
- extendedWaitUntil:
    visible: "Thanks for the rating!"
    timeout: 15000
- assertNotVisible:
    id: rating-error
- takeScreenshot: 02-rating-submitted
# The toast covers the next row's center; let it clear before tapping on.
- extendedWaitUntil:
    notVisible: "Thanks for the rating!"
    timeout: 15000

# 2. Bug report
- tapOn:
    id: feedback-row-bug
- extendedWaitUntil:
    visible:
      id: bug-title-input
    timeout: 15000
- tapOn:
    id: bug-title-input
- inputText: "Timer label clipped"
- tapOn:
    id: bug-details-input
- inputText: "Noticed minor clipping on narrow viewport"
# The sheet scrolls inside itself; its submit button starts below the 625px
# web viewport, which the driver omits. Drag the sheet's content up to it.
- repeat:
    while:
      notVisible:
        id: bug-submit-button
    times: 4
    commands:
      - swipe:
          start: "50%, 85%"
          end: "50%, 45%"
          duration: 400
- tapOn:
    id: bug-severity-minor
- tapOn:
    id: bug-submit-button
- extendedWaitUntil:
    visible: "Bug report sent"
    timeout: 15000
- assertNotVisible:
    id: bug-error
- takeScreenshot: 03-bug-submitted
# The toast covers the next row's center; let it clear before tapping on.
- extendedWaitUntil:
    notVisible: "Bug report sent"
    timeout: 15000

# 3. Feature request
- tapOn:
    id: feedback-row-feature
- extendedWaitUntil:
    visible:
      id: feature-category-progress_maxes
    timeout: 15000
- tapOn:
    id: feature-category-progress_maxes
- tapOn:
    id: feature-title-input
- inputText: "Rest timer audio cue"
# The sheet scrolls inside itself; its submit button starts below the 625px
# web viewport, which the driver omits. Drag the sheet's content up to it.
- repeat:
    while:
      notVisible:
        id: feature-submit-button
    times: 4
    commands:
      - swipe:
          start: "50%, 85%"
          end: "50%, 45%"
          duration: 400
- tapOn:
    id: feature-details-input
- inputText: "Short chime when rest finishes"
- tapOn:
    id: feature-submit-button
- extendedWaitUntil:
    visible: "Idea sent!"
    timeout: 15000
- assertNotVisible:
    id: feature-error
- takeScreenshot: 04-feature-submitted
- runFlow: ../subflows/_evidence-stop.yaml
