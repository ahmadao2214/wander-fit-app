url: ${VERIFY_URL}
---
# Regression for History reading the trainer-era table: a persona with
# completed GPP sessions (persona state with-history: one today, plus every
# day of the two weeks before this one) must see them listed.
- runFlow: ../subflows/_evidence-start.yaml
- runFlow: ../subflows/_open-sign-in.yaml
- runFlow: ../subflows/_sign-in.yaml
- extendedWaitUntil:
    visible:
      id: today-workout-card
    timeout: 90000
- takeScreenshot: 01-today
- tapOn: "History"
- extendedWaitUntil:
    visible: "Workout history"
    timeout: 30000
- extendedWaitUntil:
    visible: "GPP W1D1"
    timeout: 30000
# Completed rows show the check (spoken "Completed") and no status chip.
# Web reports the aria-label as the id; native reports the testID.
- assertVisible:
    id: "history-completed|Completed"
- assertNotVisible: "Not finished"
- assertNotVisible: "(?i)no workouts yet"
# Progress lives on History as one line (design audit F06), with weeks on
# plan once there are two. The count of weeks can read 3 when the local week
# and the UTC week the persona was seeded in differ, near midnight on Sunday.
- assertVisible: "15 workouts done · [23] weeks on plan"
- takeScreenshot: 02-history
- runFlow: ../subflows/_evidence-stop.yaml
