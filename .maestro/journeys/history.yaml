url: ${VERIFY_URL}
---
# Regression for History reading the trainer-era table: a persona with one
# completed GPP session (persona state with-history) must see it listed.
- runFlow: ../subflows/_evidence-start.yaml
- runFlow: ../subflows/_open-sign-in.yaml
- runFlow: ../subflows/_sign-in.yaml
- extendedWaitUntil:
    visible:
      id: today-workout-card
    timeout: 90000
- takeScreenshot: 01-today
- tapOn: "History"
- extendedWaitUntil:
    visible: "WORKOUT HISTORY"
    timeout: 30000
- extendedWaitUntil:
    visible: "GPP W1D1"
    timeout: 30000
# Completed rows show the check (spoken "Completed") and no status chip.
# Web reports the aria-label as the id; native reports the testID.
- assertVisible:
    id: "history-completed|Completed"
- assertNotVisible: "Not finished"
- assertNotVisible: "(?i)no workouts yet"
- takeScreenshot: 02-history
- runFlow: ../subflows/_evidence-stop.yaml
