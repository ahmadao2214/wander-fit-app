url: ${VERIFY_URL}
---
# The First Run (v2), signed out: four question screens, the two-part reveal
# (Category, then Plan), Save my plan with a new account, then the Program
# tab with Day 1 up next. Nothing starts by itself. See
# .claude/skills/verify-wander-fit/features/first-run.md.
- runFlow: ../subflows/_evidence-start.yaml
- extendedWaitUntil:
    visible: "LET'S BUILD YOUR PLAN FOR THIS SEASON."
    timeout: 90000
- assertNotVisible: "WELCOME BACK"
- takeScreenshot: 01-promise
- tapOn:
    id: first-run-start
# Maestro web reports a pressable's accessibility label as its id, so labeled
# tiles and rows are matched by that label. Inputs and buttons keep their
# testID (see .maestro/flow-layout.md).
- extendedWaitUntil:
    visible: "PICK YOUR SPORT"
    timeout: 30000
- assertVisible: "POPULAR"
# Regression: "hockey" once showed nothing, because matches rendered below the
# fold and search skipped the Popular row. Searching now folds Popular away and
# covers every sport. The field sits under the Popular grid, so swipe first.
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 800
# Web reports TextInput's accessibilityLabel ("Search sports") as id while
# native uses testID ("sport-search"). Match both.
- tapOn:
    id: "Search sports|sport-search"
- inputText: "hockey"
- extendedWaitUntil:
    visible: "Ice Hockey"
    timeout: 10000
- assertVisible: "Field Hockey"
- assertNotVisible: "POPULAR"
- eraseText: 10
# Basketball is a Popular sport, which search used to skip ("No sport
# matches"), so finding it proves search covers every sport.
- inputText: "basketball"
- assertNotVisible: "No sport matches.*"
- tapOn:
    id: "Basketball"
- takeScreenshot: 02-sport
- tapOn:
    id: first-run-continue
# No set season keeps the plan at the 12-week default whatever the date. The
# calendar pushes the row below the 625px viewport, so swipe the page first.
- extendedWaitUntil:
    visible: "WHEN'S YOUR FIRST GAME?"
    timeout: 30000
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 800
- tapOn: "No set season"
- takeScreenshot: 03-season
- tapOn:
    id: first-run-continue
# Mon, Wed and Fri come preselected.
- extendedWaitUntil:
    visible: "3 SESSIONS A WEEK"
    timeout: 30000
- assertVisible: "Mon / Wed / Fri"
- takeScreenshot: 04-days
- tapOn:
    id: first-run-continue
# About you is a player card: one labeled question at a time, and the second
# answer starts the reveal with no Continue button.
- extendedWaitUntil:
    visible: "AGE GROUP"
    timeout: 30000
- tapOn: "Performance"
- extendedWaitUntil:
    visible: "YEARS TRAINING FOR YOUR SPORT"
    timeout: 10000
- tapOn: "New to training"
- takeScreenshot: 05-about
# The reveal opens on the category and moves on to the plan after 3 s. On web,
# Maestro's settle wait after the tap can outlast that hold, so wait for the
# plan, then go back to the category through the POWER chip, which is
# deterministic and covers the way back.
- extendedWaitUntil:
    visible: "BASKETBALL PLAN"
    timeout: 60000
- tapOn:
    id: "Power. See your category again"
- extendedWaitUntil:
    visible: "BASKETBALL TRAINS FOR"
    timeout: 10000
- assertVisible: "Tap to go back to your plan"
- takeScreenshot: 06-category
- tapOn: "Tap to go back to your plan"
# The plan, from the real GPP week 1 templates for Basketball Novice.
- extendedWaitUntil:
    visible: "BASKETBALL PLAN"
    timeout: 30000
- assertVisible: "NO SET SEASON · 12-WEEK PLAN"
- assertVisible: "Build the base"
- extendedWaitUntil:
    visible: "Day 1 · .* · Lower Body A · About \\d+ min"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: first-run-save
    timeout: 10000
- assertVisible: "36"
- takeScreenshot: 07-plan
# The plan runs past the 625px viewport, leaving Save half below the fold
# of its ScrollView; swipe it into view, as on the season screen.
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 800
- tapOn:
    id: first-run-save
- extendedWaitUntil:
    visible:
      id: save-plan-email
    timeout: 30000
- assertNotVisible: "Skip"
- takeScreenshot: 08-save-plan
- tapOn:
    id: save-plan-email
- extendedWaitUntil:
    visible:
      id: save-plan-name
    timeout: 10000
- tapOn:
    id: save-plan-name
- inputText: "Verify Athlete"
- tapOn:
    id: save-plan-email-input
- inputText: ${PERSONA_EMAIL}
- tapOn:
    id: save-plan-password
- inputText: ${PERSONA_PASSWORD}
- tapOn:
    id: save-plan-create
- extendedWaitUntil:
    visible: "Check your email"
    timeout: 90000
# Clerk's fixed code for +clerk_test addresses; the sheet submits at six digits.
- tapOn:
    id: save-plan-code
- inputText: "424242"
# The save lands on the Program tab with Day 1 up next. Nothing auto-starts.
- extendedWaitUntil:
    visible: "Up next · .*"
    timeout: 90000
- assertVisible: "Build the base"
- assertNotVisible: "WARMUP"
- takeScreenshot: 09-program
- runFlow: ../subflows/_evidence-stop.yaml
