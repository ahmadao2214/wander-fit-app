url: ${VERIFY_URL}
---
- runFlow: ../subflows/_evidence-start.yaml
- runFlow: ../subflows/_open-sign-in.yaml
- runFlow: ../subflows/_sign-in.yaml
- extendedWaitUntil:
    visible:
      id: today-workout-card
    timeout: 90000
- tapOn: "Profile"
- extendedWaitUntil:
    visible: "Training info"
    timeout: 30000
# Scroll Profile to bring App settings into the viewport, then tap the real card
- evalScript: ${var base = VERIFY_URL; if (base.endsWith('/')) base = base.slice(0, -1); if (base.endsWith('/sign-in')) base = base.slice(0, -8); output.profileBottomUrl = base + '/profile#sign-out'}
- openLink: ${output.profileBottomUrl}
- extendedWaitUntil:
    visible:
      id: profile-app-settings
    timeout: 30000
- tapOn:
    id: profile-app-settings
- extendedWaitUntil:
    visible: "App Settings"
    timeout: 30000
- assertVisible: "Privacy"
- assertVisible: "Use with Claude"
- assertVisible: "Share anonymous usage analytics"
- assertVisible: ".*Never includes your name.*"
- takeScreenshot: 01-settings-telemetry
# Toggle analytics off; the description switches to the opted-out line
- tapOn:
    id: "Share anonymous usage analytics"
- extendedWaitUntil:
    visible: ".*send usage data from this account.*"
    timeout: 15000
- takeScreenshot: 02-settings-opted-out
# Navigate back to Profile, reopen App settings, and assert persistence (still opted out)
- tapOn:
    id: "Back"
# Back lands on Profile at its previous scroll position, near the Settings row
- extendedWaitUntil:
    visible:
      id: profile-app-settings
    timeout: 30000
- tapOn:
    id: profile-app-settings
- extendedWaitUntil:
    visible: "App Settings"
    timeout: 30000
- extendedWaitUntil:
    visible: ".*send usage data from this account.*"
    timeout: 15000
- takeScreenshot: 03-settings-persisted-off
# Restore to On
- tapOn:
    id: "Share anonymous usage analytics"
- extendedWaitUntil:
    visible: ".*Never includes your name.*"
    timeout: 15000
- runFlow: ../subflows/_evidence-stop.yaml
