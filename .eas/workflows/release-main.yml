# Build and ship every merge to main to TestFlight internal testers.
# Each run uses one iOS build from the EAS plan (Free: 15/month).
name: Main → TestFlight

on:
  push:
    branches: ['main']

jobs:
  build_ios:
    name: Build iOS (production)
    type: build
    params:
      platform: ios
      profile: production

  # `submit` rather than `testflight`: the testflight job needs a paid EAS
  # plan to upload an EAS build. No `groups`: "Offseason Asrafit Testers" has
  # automatic distribution on, and Apple rejects adding such a group by hand.
  submit_ios:
    name: Upload to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
