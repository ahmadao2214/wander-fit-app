<!DOCTYPE html><html><head><meta charset="utf-8"><title>Program and Execute</title><style>
    html, body { margin: 0; background: transparent; color: var(--foreground); font-family: var(--font-sans, system-ui), sans-serif; }
    .sheet { display: grid; grid-template-columns: 1fr 1fr; gap: 28px 20px; }
    .cap { margin: 0 0 8px; font-size: 13px; letter-spacing: 0.02em; }
    .phone, section { box-sizing: border-box; }
    section { display: flex; flex-direction: column; height: 640px; border-radius: 28px; padding: 22px 16px 16px; }
    h2 { margin: 0 0 12px; font-size: 22px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .board { flex: 1; min-height: 0; }
    .board svg { width: 100%; height: 100%; display: block; }
    .work { flex: 1; display: flex; flex-direction: column; justify-content: flex-start; gap: 8px; padding-top: 12px; }
    .lift { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .set, .reps, .load { margin: 0; font-size: 15px; }
    .reps span, .load span { font-size: 56px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.04em; }
    button { height: 48px; border: 0; border-radius: 14px; font-family: inherit; font-weight: 700; font-size: 16px; line-height: 1; }
  </style></head><body><main class="sheet"><div class="cell"><p class="cap">Program · chalkboard</p><section data-screen="program" data-scheme="chalkboard" style="background:#1b1511;color:#ede7df"><h2>Program</h2><div class="board"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 700"><rect width="340" height="700" fill="#1b1511"/><path d="M58 394 Q26 316 66 232" fill="none" stroke="#d8875b" stroke-width="2.8" stroke-linecap="round"/><path d="M66 232 Q150 318 254 268" fill="none" stroke="#d8875b" stroke-width="2.8" stroke-linecap="round"/><path d="M254 268 Q302 214 214 172" fill="none" stroke="#d8875b" stroke-width="2.8" stroke-linecap="round"/></svg></div><button type="button" data-role="main-button" style="background:#ede7df;color:#2a2520">Start</button></section></div><div class="cell"><p class="cap">Program · whiteboard</p><section data-screen="program" data-scheme="whiteboard" style="background:#f3f1f0;color:#25211d"><h2>Program</h2><div class="board"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 700"><rect width="340" height="700" fill="#f3f1f0"/><path d="M58 394 Q26 316 66 232" fill="none" stroke="#884b28" stroke-width="2.8" stroke-linecap="round"/><path d="M66 232 Q150 318 254 268" fill="none" stroke="#884b28" stroke-width="2.8" stroke-linecap="round"/><path d="M254 268 Q302 214 214 172" fill="none" stroke="#884b28" stroke-width="2.8" stroke-linecap="round"/></svg></div><button type="button" data-role="main-button" style="background:#25211d;color:#f3ede7">Start</button></section></div><div class="cell"><p class="cap">Execute · chalkboard</p><section data-screen="execute" data-scheme="chalkboard" style="background:#110c08;color:#ede7df"><h2>Execute</h2><div class="work"><p class="lift">Back squat</p><p class="set">Set 2 of 4</p><p class="reps"><span>6</span> reps</p><p class="load"><span>135</span> lb</p></div><button type="button" data-role="main-button" style="background:#ede7df;color:#2a2520">Log Set</button></section></div><div class="cell"><p class="cap">Execute · whiteboard</p><section data-screen="execute" data-scheme="whiteboard" style="background:#fdf7f1;color:#25211d"><h2>Execute</h2><div class="work"><p class="lift">Back squat</p><p class="set">Set 2 of 4</p><p class="reps"><span>6</span> reps</p><p class="load"><span>135</span> lb</p></div><button type="button" data-role="main-button" style="background:#25211d;color:#f3ede7">Log Set</button></section></div></main></body></html>
