# Nightly E2E: every web flow against the wander-fit-e2e dev deployment, then
# the evidence gallery on GitHub Pages (#85). The repo's Pages source must be
# set to "GitHub Actions" once, or the deploy job fails.
# Android (#83) and iOS (#84) runs will add jobs here; the gallery already
# has their columns.
name: Nightly E2E

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-e2e:
    name: Web E2E (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Same group as main's web E2E in checks.yml: both use the one
    # wander-fit-e2e deployment, so they take turns. `queue: max` keeps
    # waiting runs in order; without it GitHub keeps one pending run per group
    # and cancels it when a newer one arrives.
    concurrency:
      group: e2e-backend
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
    env:
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CONVEX_PREVIEW_NAME_E2E: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      # Secrets go only to the steps that need them. Nightly is never a pull
      # request, so it only ever gets the dev key.
      - name: Deploy functions to wander-fit-e2e and seed
        id: backend
        env:
          EXPO_PUBLIC_CONVEX_URL_E2E: ${{ vars.EXPO_PUBLIC_CONVEX_URL_E2E }}
          CONVEX_DEPLOY_KEY_E2E: ${{ secrets.CONVEX_DEPLOY_KEY_E2E }}
        run: node scripts/verify/run.mjs deploy
      - name: Run web flows
        env:
          EXPO_PUBLIC_CONVEX_URL_E2E: ${{ steps.backend.outputs.convex_url }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CONVEX_DEPLOY_KEY_E2E: ${{ secrets.CONVEX_DEPLOY_KEY_E2E }}
        run: node scripts/verify/run.mjs all
      # Deletes a persona a cancelled run left behind and redacts its password
      # from the evidence. It must run before the uploads.
      - name: Tear down
        if: always()
        env:
          EXPO_PUBLIC_CONVEX_URL_E2E: ${{ steps.backend.outputs.convex_url }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CONVEX_DEPLOY_KEY_E2E: ${{ secrets.CONVEX_DEPLOY_KEY_E2E }}
        run: node scripts/verify/run.mjs teardown
      # One upload per flow under .maestro/web, the same names as checks.yml.
      # scripts/verify/nightly.test.mjs fails when a flow has no step here.
      # The marker is written only after that flow's password scrub succeeds.
      - name: Upload sign-in evidence
        if: always() && hashFiles('e2e-artifacts/sign-in/web/.scrubbed') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-sign-in
          path: e2e-artifacts/sign-in/web/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload first-run evidence
        if: always() && hashFiles('e2e-artifacts/first-run/web/.scrubbed') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-first-run
          path: e2e-artifacts/first-run/web/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload reassessment evidence
        if: always() && hashFiles('e2e-artifacts/reassessment/web/.scrubbed') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-reassessment
          path: e2e-artifacts/reassessment/web/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload history evidence
        if: always() && hashFiles('e2e-artifacts/history/web/.scrubbed') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-history
          path: e2e-artifacts/history/web/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload workout-exit-resume evidence
        if: always() && hashFiles('e2e-artifacts/workout-exit-resume/web/.scrubbed') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-workout-exit-resume
          path: e2e-artifacts/workout-exit-resume/web/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload app-settings evidence
        if: always() && hashFiles('e2e-artifacts/app-settings/web/.scrubbed') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-app-settings
          path: e2e-artifacts/app-settings/web/
          if-no-files-found: warn
          retention-days: 30
      - name: Summary
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify/summary.mjs

  # Builds even when flows failed: a failing flow shows its last evidence,
  # marked failing. Skipped only when the run was cancelled.
  gallery:
    name: Build evidence gallery
    needs: web-e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Newest e2e-<platform>-<flow> artifact from main for every flow,
      # whichever workflow uploaded it.
      - name: Collect newest evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GALLERY_RAN_PLATFORMS: web
        run: node scripts/verify/gallery.mjs collect gallery-evidence
      - name: Build page
        run: node scripts/verify/gallery.mjs build gallery-evidence gallery-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gallery-site

  deploy:
    name: Deploy evidence gallery
    needs: gallery
    if: ${{ !cancelled() && needs.gallery.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
      - name: Link the gallery from the run summary
        env:
          PAGE_URL: ${{ steps.pages.outputs.page_url }}
        run: |
          {
            echo "## Evidence gallery"
            echo ""
            echo "Newest web, Android and iOS evidence per feature: $PAGE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
