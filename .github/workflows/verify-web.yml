# Manual cloud run of the same local web tracer. It does not gate pull requests.
name: Verify web

on:
  workflow_dispatch:

jobs:
  sign-in-screen:
    name: Sign-in screen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - name: Add Linux native binaries missing from bun.lock
        run: >-
          bun add --no-save
          "@rollup/rollup-linux-x64-gnu@$(node -p "require('rollup/package.json').version")"
          "@esbuild/linux-x64@$(node -p "require('esbuild/package.json').version")"
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Doctor, export, and drive sign-in
        env:
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_CONVEX_URL_E2E: ${{ vars.EXPO_PUBLIC_CONVEX_URL_E2E }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CONVEX_DEPLOY_KEY_E2E: ${{ secrets.CONVEX_DEPLOY_KEY_E2E }}
        run: node scripts/verify/run.mjs all
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sign-in-web
          path: e2e-artifacts/sign-in/web/
          if-no-files-found: ignore
