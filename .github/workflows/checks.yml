# Free PR checks (public repo). Builds run on EAS Workflows, see .eas/workflows/.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run test:ci

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  # Advisory: not a required check until it passes on main 10 times in a row
  # (#88). Fork PRs get no secrets, so the job is skipped there.
  web-e2e:
    name: Web E2E (advisory)
    needs: unit
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pull request runs each get their own Convex preview deployment, named
    # after the branch, so PRs run side by side. A newer push to the same PR
    # cancels the older run through the workflow-level group. Every other run
    # (main) shares the one wander-fit-e2e dev deployment and waits its turn.
    # `queue: max` keeps up to 100 waiting runs in order; without it GitHub
    # keeps one pending run and cancels it when a newer one arrives.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('e2e-preview-{0}', github.head_ref) || 'e2e-backend' }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
    env:
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      # Set on pull requests only. It selects the preview deployment.
      CONVEX_PREVIEW_NAME_E2E: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      # Secrets go only to the steps that need them, not to install scripts.
      # Pull requests get only the preview key, main gets only the dev key.
      # The step's convex_url output is the deployment the later steps use.
      - name: Deploy functions to wander-fit-e2e and seed
        id: backend
        env:
          EXPO_PUBLIC_CONVEX_URL_E2E: ${{ vars.EXPO_PUBLIC_CONVEX_URL_E2E }}
          CONVEX_DEPLOY_KEY_E2E: ${{ github.event_name != 'pull_request' && secrets.CONVEX_DEPLOY_KEY_E2E || '' }}
          CONVEX_PREVIEW_DEPLOY_KEY_E2E: ${{ github.event_name == 'pull_request' && secrets.CONVEX_PREVIEW_DEPLOY_KEY_E2E || '' }}
        run: node scripts/verify/run.mjs deploy
      - name: Run web flows
        env:
          EXPO_PUBLIC_CONVEX_URL_E2E: ${{ steps.backend.outputs.convex_url }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CONVEX_DEPLOY_KEY_E2E: ${{ github.event_name != 'pull_request' && secrets.CONVEX_DEPLOY_KEY_E2E || '' }}
          CONVEX_PREVIEW_DEPLOY_KEY_E2E: ${{ github.event_name == 'pull_request' && secrets.CONVEX_PREVIEW_DEPLOY_KEY_E2E || '' }}
        run: node scripts/verify/run.mjs all
      # Deletes a persona a cancelled run left behind and redacts its password
      # from the evidence. It must run before the uploads.
      - name: Tear down
        if: always()
        env:
          EXPO_PUBLIC_CONVEX_URL_E2E: ${{ steps.backend.outputs.convex_url }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CONVEX_DEPLOY_KEY_E2E: ${{ github.event_name != 'pull_request' && secrets.CONVEX_DEPLOY_KEY_E2E || '' }}
          CONVEX_PREVIEW_DEPLOY_KEY_E2E: ${{ github.event_name == 'pull_request' && secrets.CONVEX_PREVIEW_DEPLOY_KEY_E2E || '' }}
        run: node scripts/verify/run.mjs teardown
      # One upload per flow under .maestro/web. scripts/verify/flows.test.mjs
      # fails when a flow has no step here. The marker is written only after
      # that flow's password scrub succeeds, so a failed scrub is not uploaded.
      - name: Upload sign-in evidence
        if: always() && hashFiles('e2e-artifacts/sign-in/web/.scrubbed') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-sign-in
          path: e2e-artifacts/sign-in/web/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload sign-up evidence
        if: always() && hashFiles('e2e-artifacts/sign-up/web/.scrubbed') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-sign-up
          path: e2e-artifacts/sign-up/web/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload activation evidence
        if: always() && hashFiles('e2e-artifacts/activation/web/.scrubbed') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-activation
          path: e2e-artifacts/activation/web/
          if-no-files-found: warn
          retention-days: 14
      - name: Summary
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify/summary.mjs
