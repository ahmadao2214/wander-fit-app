# Free PR checks (public repo). Builds run on EAS Workflows, see .eas/workflows/.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run test:ci

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  # Decides whether Web E2E needs a per-PR Convex preview ("preview"), can reuse
  # the shared wander-fit-e2e dev backend ("shared"), or is a main/manual run
  # ("dev"). Running this before web-e2e lets shared PR runs acquire the same
  # e2e-backend concurrency lock as main/nightly so deploys never overlap flows.
  backend-mode:
    name: Select E2E backend mode
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select E2E backend mode
        id: detect
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/verify/run.mjs backend-mode

  # Advisory: not a required check until it passes on main 10 times in a row
  # (#88). Fork PRs get no secrets, so the job is skipped there.
  web-e2e:
    name: Web E2E (advisory)
    needs: backend-mode
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pull request runs touching Convex runtime code get their own preview
    # deployment (pr-<number>) and run side by side. Shared PR runs, main, and
    # nightly all target wander-fit-e2e dev and serialize under e2e-backend so
    # a deploy/reseed never runs mid-flow.
    concurrency:
      group: ${{ needs.backend-mode.outputs.mode == 'preview' && format('e2e-preview-pr-{0}', github.event.pull_request.number) || 'e2e-backend' }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
    env:
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      # Secrets go only to the steps that need them, not to install scripts.
      # Preview PRs get only the preview key; main gets only the dev key;
      # shared PRs skip deploy completely (no Convex keys needed for deploy).
      # The step's convex_url output is the deployment the later steps use.
      - name: Deploy functions to wander-fit-e2e and seed
        id: backend
        env:
          VERIFY_BACKEND_MODE: ${{ needs.backend-mode.outputs.mode }}
          EXPO_PUBLIC_CONVEX_URL_E2E: ${{ vars.EXPO_PUBLIC_CONVEX_URL_E2E }}
          CONVEX_PREVIEW_NAME_E2E: ${{ needs.backend-mode.outputs.mode == 'preview' && format('pr-{0}', github.event.pull_request.number) || '' }}
          CONVEX_DEPLOY_KEY_E2E: ${{ needs.backend-mode.outputs.mode == 'dev' && secrets.CONVEX_DEPLOY_KEY_E2E || '' }}
          CONVEX_PREVIEW_DEPLOY_KEY_E2E: ${{ needs.backend-mode.outputs.mode == 'preview' && secrets.CONVEX_PREVIEW_DEPLOY_KEY_E2E || '' }}
        run: node scripts/verify/run.mjs deploy
      - name: Run web flows
        env:
          # Pull requests skip the nightly-only flows (scripts/verify/flows.mjs);
          # main pushes run every flow.
          VERIFY_FLOW_SET: ${{ github.event_name == 'pull_request' && 'pr' || 'all' }}
          EXPO_PUBLIC_CONVEX_URL_E2E: ${{ steps.backend.outputs.convex_url }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CONVEX_PREVIEW_NAME_E2E: ${{ needs.backend-mode.outputs.mode == 'preview' && format('pr-{0}', github.event.pull_request.number) || '' }}
          CONVEX_DEPLOY_KEY_E2E: ${{ needs.backend-mode.outputs.mode != 'preview' && secrets.CONVEX_DEPLOY_KEY_E2E || '' }}
          CONVEX_PREVIEW_DEPLOY_KEY_E2E: ${{ needs.backend-mode.outputs.mode == 'preview' && secrets.CONVEX_PREVIEW_DEPLOY_KEY_E2E || '' }}
        run: node scripts/verify/run.mjs all
      # Deletes a persona a cancelled run left behind and redacts its password
      # from the evidence. It must run before the uploads.
      - name: Tear down
        if: always()
        env:
          EXPO_PUBLIC_CONVEX_URL_E2E: ${{ steps.backend.outputs.convex_url }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CONVEX_PREVIEW_NAME_E2E: ${{ needs.backend-mode.outputs.mode == 'preview' && format('pr-{0}', github.event.pull_request.number) || '' }}
          CONVEX_DEPLOY_KEY_E2E: ${{ needs.backend-mode.outputs.mode != 'preview' && secrets.CONVEX_DEPLOY_KEY_E2E || '' }}
          CONVEX_PREVIEW_DEPLOY_KEY_E2E: ${{ needs.backend-mode.outputs.mode == 'preview' && secrets.CONVEX_PREVIEW_DEPLOY_KEY_E2E || '' }}
        run: node scripts/verify/run.mjs teardown
      # One upload per flow under .maestro/web. scripts/verify/flows.test.mjs
      # fails when a flow has no step here. The marker is written only after
      # that flow's password scrub succeeds, so a failed scrub is not uploaded.
      - name: Upload sign-in evidence
        if: always() && hashFiles('e2e-artifacts/sign-in/web/.scrubbed') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-sign-in
          path: e2e-artifacts/sign-in/web/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload first-run evidence
        if: always() && hashFiles('e2e-artifacts/first-run/web/.scrubbed') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-first-run
          path: e2e-artifacts/first-run/web/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload reassessment evidence
        if: always() && hashFiles('e2e-artifacts/reassessment/web/.scrubbed') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-reassessment
          path: e2e-artifacts/reassessment/web/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload history evidence
        if: always() && hashFiles('e2e-artifacts/history/web/.scrubbed') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-history
          path: e2e-artifacts/history/web/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload workout-exit-resume evidence
        if: always() && hashFiles('e2e-artifacts/workout-exit-resume/web/.scrubbed') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-workout-exit-resume
          path: e2e-artifacts/workout-exit-resume/web/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload app-settings evidence
        if: always() && hashFiles('e2e-artifacts/app-settings/web/.scrubbed') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-app-settings
          path: e2e-artifacts/app-settings/web/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload workout-loop evidence
        if: always() && hashFiles('e2e-artifacts/workout-loop/web/.scrubbed') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-workout-loop
          path: e2e-artifacts/workout-loop/web/
          if-no-files-found: warn
          retention-days: 14
      - name: Summary
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify/summary.mjs
