# Free PR checks (public repo). Builds run on EAS Workflows, see .eas/workflows/.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: Vitest (Convex)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      # bun.lock only records the macOS builds of Rollup and esbuild, which
      # Vitest needs; add the Linux ones at the installed versions.
      - name: Add Linux native binaries missing from bun.lock
        run: >-
          bun add --no-save
          "@rollup/rollup-linux-x64-gnu@$(node -p "require('rollup/package.json').version")"
          "@esbuild/linux-x64@$(node -p "require('esbuild/package.json').version")"
      - run: bun run test:unit
      - run: bunx vitest run lib/__tests__/signUpErrors.test.ts

  # Informational until the Jest/Vitest split is fixed: a failure here
  # shows on the PR but does not fail the workflow.
  jest:
    name: Jest (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: npx jest --ci

  # Advisory: not a required check until it passes on main 10 times in a row
  # (#88). Fork PRs get no secrets, so the job is skipped there.
  web-e2e:
    name: Web E2E (advisory)
    needs: vitest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One backend: every E2E job waits for the one before it.
    concurrency:
      group: e2e-backend
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_CONVEX_URL_E2E: ${{ vars.EXPO_PUBLIC_CONVEX_URL_E2E }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      # The Convex CLI bundles with esbuild, so it needs the Linux build too.
      - name: Add Linux native binaries missing from bun.lock
        run: >-
          bun add --no-save
          "@rollup/rollup-linux-x64-gnu@$(node -p "require('rollup/package.json').version")"
          "@esbuild/linux-x64@$(node -p "require('esbuild/package.json').version")"
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      # Secrets go only to the steps that need them, not to install scripts.
      - name: Deploy functions to wander-fit-e2e and seed
        env:
          CONVEX_DEPLOY_KEY_E2E: ${{ secrets.CONVEX_DEPLOY_KEY_E2E }}
        run: node scripts/verify/run.mjs deploy
      - name: Run web flows
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CONVEX_DEPLOY_KEY_E2E: ${{ secrets.CONVEX_DEPLOY_KEY_E2E }}
        run: node scripts/verify/run.mjs all
      # Deletes a persona a cancelled run left behind and redacts its password
      # from the evidence. It must run before the uploads.
      - name: Tear down
        if: always()
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CONVEX_DEPLOY_KEY_E2E: ${{ secrets.CONVEX_DEPLOY_KEY_E2E }}
        run: node scripts/verify/run.mjs teardown
      # One upload per flow under .maestro/web. scripts/verify/flows.test.mjs
      # fails when a flow has no step here. The marker is written only after
      # that flow's password scrub succeeds, so a failed scrub is not uploaded.
      - name: Upload sign-in evidence
        if: always() && hashFiles('e2e-artifacts/sign-in/web/.scrubbed') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-sign-in
          path: e2e-artifacts/sign-in/web/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload sign-up evidence
        if: always() && hashFiles('e2e-artifacts/sign-up/web/.scrubbed') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-sign-up
          path: e2e-artifacts/sign-up/web/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload activation evidence
        if: always() && hashFiles('e2e-artifacts/activation/web/.scrubbed') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-activation
          path: e2e-artifacts/activation/web/
          if-no-files-found: warn
          retention-days: 14
      - name: Summary
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify/summary.mjs
