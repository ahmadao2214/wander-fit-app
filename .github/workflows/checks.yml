# Free PR checks (public repo). Builds run on EAS Workflows, see .eas/workflows/.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit tests (Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Run unit tests (budgeted)
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci/run-budgeted.mjs --name "Unit tests (Jest)" --max-seconds 120 -- node scripts/ci/select-tests.mjs

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Run typecheck (budgeted)
        run: node scripts/ci/run-budgeted.mjs --name "Typecheck" --max-seconds 30 -- bun run typecheck

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: ${{ github.event_name == 'push' && '0' || '2' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Run lint and format check (budgeted)
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/ci/run-budgeted.mjs --name "Lint & format" --max-seconds 30 -- sh -c "bun run lint && bun run format:check"

  # Plans Web E2E: selects the backend mode ("preview", "shared", or "dev"),
  # picks affected flows on PRs (all flows on main/manual), and balances them
  # into parallel shards by recorded run time.
  e2e-plan:
    name: Plan Web E2E
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      run_e2e: ${{ steps.plan.outputs.run_e2e }}
      shards: ${{ steps.plan.outputs.shards }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plan Web E2E shards and backend
        id: plan
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/verify/run.mjs plan

  # Holds the backend concurrency lock across BOTH deploy/export AND every
  # parallel E2E shard so nightly or another main run can never deploy/reseed
  # wander-fit-e2e mid-shard, while shards of the same run still run in parallel.
  e2e-run:
    name: Web E2E
    needs: e2e-plan
    if: needs.e2e-plan.outputs.run_e2e == 'true'
    # Preview PRs deploy to isolated pr-<number> deployments side by side.
    # Shared PRs, main, and nightly serialize the full build+shard run under
    # e2e-backend.
    concurrency:
      group: ${{ needs.e2e-plan.outputs.mode == 'preview' && format('e2e-preview-pr-{0}', github.event.pull_request.number) || 'e2e-backend' }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/web-e2e-run.yml
    with:
      mode: ${{ needs.e2e-plan.outputs.mode }}
      shards: ${{ needs.e2e-plan.outputs.shards }}
      preview_name: ${{ needs.e2e-plan.outputs.mode == 'preview' && format('pr-{0}', github.event.pull_request.number) || '' }}
    secrets:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CONVEX_DEPLOY_KEY_E2E: ${{ secrets.CONVEX_DEPLOY_KEY_E2E }}
      CONVEX_PREVIEW_DEPLOY_KEY_E2E: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY_E2E }}

  # Advisory: single status check summarizing all shards (#88).
  web-e2e:
    name: Web E2E (advisory)
    needs: [e2e-plan, e2e-run]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download shard results
        if: needs.e2e-plan.outputs.run_e2e == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-results-shard-*
          path: e2e-artifacts/shards/
      - name: Summary
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERIFY_RESULTS_DIR: e2e-artifacts/shards
          VERIFY_E2E_SKIPPED: ${{ needs.e2e-plan.outputs.run_e2e != 'true' && 'true' || 'false' }}
          VERIFY_E2E_REASON: ${{ needs.e2e-plan.outputs.reason }}
        run: node scripts/verify/summary.mjs
      - name: Verify shard results
        env:
          PLAN_RESULT: ${{ needs.e2e-plan.result }}
          RUN_RESULT: ${{ needs.e2e-run.result }}
          RUN_E2E: ${{ needs.e2e-plan.outputs.run_e2e }}
        run: |
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "e2e-plan did not succeed ($PLAN_RESULT)"
            exit 1
          fi
          if [ "$RUN_E2E" = "true" ] && [ "$RUN_RESULT" != "success" ]; then
            echo "Web E2E failed (e2e-run=$RUN_RESULT)"
            exit 1
          fi
