# Free PR checks (public repo). Builds run on EAS Workflows, see .eas/workflows/.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run test:ci

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  # Plans Web E2E: selects the backend mode ("preview", "shared", or "dev"),
  # picks affected flows on PRs (all flows on main/manual), and balances them
  # into parallel shards by recorded run time.
  e2e-plan:
    name: Plan Web E2E
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      run_e2e: ${{ steps.plan.outputs.run_e2e }}
      shards: ${{ steps.plan.outputs.shards }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plan Web E2E shards and backend
        id: plan
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/verify/run.mjs plan

  # Deploys/seeds Convex at most once and exports the web bundle once for all
  # parallel E2E shards. Skipped entirely when a PR has no affected E2E flows.
  e2e-build:
    name: Build Web E2E
    needs: e2e-plan
    if: needs.e2e-plan.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Preview PRs deploy to isolated pr-<number> deployments side by side.
    # Shared PRs, main, and nightly serialize deploys under e2e-backend.
    concurrency:
      group: ${{ needs.e2e-plan.outputs.mode == 'preview' && format('e2e-preview-pr-{0}', github.event.pull_request.number) || 'e2e-backend' }}
      cancel-in-progress: false
      queue: max
    outputs:
      convex_url: ${{ steps.backend.outputs.convex_url }}
    env:
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      # Secrets go only to the steps that need them, not to install scripts.
      # Preview PRs get only the preview key; main gets only the dev key;
      # shared PRs skip deploy completely (no Convex keys needed for deploy).
      - name: Deploy functions to wander-fit-e2e and seed
        id: backend
        env:
          VERIFY_BACKEND_MODE: ${{ needs.e2e-plan.outputs.mode }}
          EXPO_PUBLIC_CONVEX_URL_E2E: ${{ vars.EXPO_PUBLIC_CONVEX_URL_E2E }}
          CONVEX_PREVIEW_NAME_E2E: ${{ needs.e2e-plan.outputs.mode == 'preview' && format('pr-{0}', github.event.pull_request.number) || '' }}
          CONVEX_DEPLOY_KEY_E2E: ${{ needs.e2e-plan.outputs.mode == 'dev' && secrets.CONVEX_DEPLOY_KEY_E2E || '' }}
          CONVEX_PREVIEW_DEPLOY_KEY_E2E: ${{ needs.e2e-plan.outputs.mode == 'preview' && secrets.CONVEX_PREVIEW_DEPLOY_KEY_E2E || '' }}
        run: node scripts/verify/run.mjs deploy
      - name: Export web bundle once
        env:
          EXPO_PUBLIC_CONVEX_URL_E2E: ${{ steps.backend.outputs.convex_url }}
        run: node scripts/verify/run.mjs export
      - name: Upload web export for shards
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-dist
          path: dist-verify/
          retention-days: 1

  # Runs each balanced shard of Maestro web flows in parallel using the shared
  # dist-verify/ artifact built by e2e-build.
  e2e-shard:
    name: Web E2E shard ${{ matrix.shard.id }}
    needs: [e2e-plan, e2e-build]
    if: needs.e2e-plan.outputs.run_e2e == 'true' && needs.e2e-build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.e2e-plan.outputs.shards) }}
    permissions:
      contents: read
      actions: read
    env:
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Download shared web export
        uses: actions/download-artifact@v4
        with:
          name: e2e-web-dist
          path: dist-verify/
      - name: Run web flows
        env:
          EXPO_PUBLIC_CONVEX_URL_E2E: ${{ needs.e2e-build.outputs.convex_url }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CONVEX_PREVIEW_NAME_E2E: ${{ needs.e2e-plan.outputs.mode == 'preview' && format('pr-{0}', github.event.pull_request.number) || '' }}
          CONVEX_DEPLOY_KEY_E2E: ${{ needs.e2e-plan.outputs.mode != 'preview' && secrets.CONVEX_DEPLOY_KEY_E2E || '' }}
          CONVEX_PREVIEW_DEPLOY_KEY_E2E: ${{ needs.e2e-plan.outputs.mode == 'preview' && secrets.CONVEX_PREVIEW_DEPLOY_KEY_E2E || '' }}
        run: node scripts/verify/run.mjs all ${{ join(matrix.shard.flows, ' ') }}
      # Deletes a persona a cancelled run left behind and redacts its password
      # from the evidence. It must run before the uploads.
      - name: Tear down
        if: always()
        env:
          EXPO_PUBLIC_CONVEX_URL_E2E: ${{ needs.e2e-build.outputs.convex_url }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CONVEX_PREVIEW_NAME_E2E: ${{ needs.e2e-plan.outputs.mode == 'preview' && format('pr-{0}', github.event.pull_request.number) || '' }}
          CONVEX_DEPLOY_KEY_E2E: ${{ needs.e2e-plan.outputs.mode != 'preview' && secrets.CONVEX_DEPLOY_KEY_E2E || '' }}
          CONVEX_PREVIEW_DEPLOY_KEY_E2E: ${{ needs.e2e-plan.outputs.mode == 'preview' && secrets.CONVEX_PREVIEW_DEPLOY_KEY_E2E || '' }}
        run: node scripts/verify/run.mjs teardown
      # One upload per flow under .maestro/web. scripts/verify/flows.test.mjs
      # fails when a flow has no step here. The marker is written only after
      # that flow's password scrub succeeds, so a failed scrub is not uploaded.
      - name: Upload sign-in evidence
        if: always() && hashFiles('e2e-artifacts/sign-in/web/.scrubbed') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-sign-in
          path: e2e-artifacts/sign-in/web/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload first-run evidence
        if: always() && hashFiles('e2e-artifacts/first-run/web/.scrubbed') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-first-run
          path: e2e-artifacts/first-run/web/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload reassessment evidence
        if: always() && hashFiles('e2e-artifacts/reassessment/web/.scrubbed') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-reassessment
          path: e2e-artifacts/reassessment/web/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload history evidence
        if: always() && hashFiles('e2e-artifacts/history/web/.scrubbed') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-history
          path: e2e-artifacts/history/web/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload workout-exit-resume evidence
        if: always() && hashFiles('e2e-artifacts/workout-exit-resume/web/.scrubbed') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-workout-exit-resume
          path: e2e-artifacts/workout-exit-resume/web/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload app-settings evidence
        if: always() && hashFiles('e2e-artifacts/app-settings/web/.scrubbed') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-app-settings
          path: e2e-artifacts/app-settings/web/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload workout-loop evidence
        if: always() && hashFiles('e2e-artifacts/workout-loop/web/.scrubbed') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-workout-loop
          path: e2e-artifacts/workout-loop/web/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload shard results
        if: always() && hashFiles('e2e-artifacts/web-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-shard-${{ matrix.shard.id }}
          path: e2e-artifacts/web-results.json
          if-no-files-found: ignore
          retention-days: 1

  # Advisory: single status check summarizing all shards (#88).
  web-e2e:
    name: Web E2E (advisory)
    needs: [e2e-plan, e2e-build, e2e-shard]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download shard results
        if: needs.e2e-plan.outputs.run_e2e == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-results-shard-*
          path: e2e-artifacts/shards/
      - name: Summary
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERIFY_RESULTS_DIR: e2e-artifacts/shards
          VERIFY_E2E_SKIPPED: ${{ needs.e2e-plan.outputs.run_e2e != 'true' && 'true' || 'false' }}
          VERIFY_E2E_REASON: ${{ needs.e2e-plan.outputs.reason }}
        run: node scripts/verify/summary.mjs
      - name: Verify shard results
        env:
          PLAN_RESULT: ${{ needs.e2e-plan.result }}
          BUILD_RESULT: ${{ needs.e2e-build.result }}
          SHARD_RESULT: ${{ needs.e2e-shard.result }}
          RUN_E2E: ${{ needs.e2e-plan.outputs.run_e2e }}
        run: |
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "e2e-plan did not succeed ($PLAN_RESULT)"
            exit 1
          fi
          if [ "$RUN_E2E" = "true" ] && { [ "$BUILD_RESULT" != "success" ] || [ "$SHARD_RESULT" != "success" ]; }; then
            echo "Web E2E failed (build=$BUILD_RESULT, shard=$SHARD_RESULT)"
            exit 1
          fi
